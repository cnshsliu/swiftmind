name: SwiftMindMac
options:
  bundleIdPrefix: app.swiftmind
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  SwiftMind:
    path: ../../
targets:
  SwiftMindMac:
    type: application
    platform: macOS
    sources:
      - path: SwiftMindMac
        # Generator input for the bundled Welcome map — not a runtime resource.
        excludes:
          - "Resources/help-map.ops.json"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.swiftmind.mac
        PRODUCT_NAME: SwiftMind
        SM_DISPLAY_NAME: SwiftMind
        INFOPLIST_FILE: SwiftMindMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: SwiftMindMac/SwiftMindMac.entitlements
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: true
      # Debug is a "canary" instance: own bundle id → own sandbox container,
      # preferences and agent-bridge socket, so it can run alongside the
      # permanent Release install without either affecting the other.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.swiftmind.mac.dev
          SM_DISPLAY_NAME: SwiftMind Dev
    dependencies:
      - package: SwiftMind
        product: SwiftMindCore

  SwiftMindMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - SwiftMindMacUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.swiftmind.mac.uitests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: SwiftMindMacUITests/SwiftMindMacUITests.entitlements
        TEST_TARGET_NAME: SwiftMindMac
    dependencies:
      - target: SwiftMindMac

schemes:
  SwiftMindMac:
    build:
      targets:
        SwiftMindMac: all
        SwiftMindMacUITests: [test]
    run:
      config: Debug
      # CRITICAL: must be false. When true, Xcode injects
      #   -NSDocumentRevisionsDebugMode YES
      # and DocumentGroup treats "YES" as a file path →
      #   The document "YES" could not be opened.
      debugDocumentVersioning: false
    test:
      config: Debug
      targets:
        - SwiftMindMacUITests
      gatherCoverageData: false
    profile:
      config: Release
      debugDocumentVersioning: false
