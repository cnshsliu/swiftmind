<!DOCTYPE html>
<html lang="en" data-swiftmind-version="1">
<head>
<meta charset="utf-8"/>
<title>Minimal Map</title>
<style>
body {
  font-family: -apple-system, system-ui, sans-serif;
  margin: 24px;
  line-height: 1.45;
  color: #1d1d1f;
  background: #fafafa;
}
.swiftmind-map {
  max-width: 48rem;
}
.swiftmind-map ul {
  list-style: none;
  margin: 0;
  padding-left: 1.25rem;
  border-left: 2px solid #d0d0d5;
}
.swiftmind-map > ul {
  padding-left: 0;
  border-left: none;
}
.swiftmind-map li {
  margin: 0.4rem 0;
}
.node-title {
  display: inline-block;
  padding: 0.2rem 0.5rem;
  border-radius: 6px;
  background: #fff;
  border: 1px solid #e5e5ea;
  font-weight: 500;
}
</style>
</head>
<body>
<article class="swiftmind-map" data-schema="1" data-map-id="m_minimal_fixture">
<ul>
  <li data-node-id="n_root" data-side="auto" data-folded="false" data-font-size="22" data-bold="true" data-text-color="#000000" data-fill-color="">
    <span class="node-title">Central Idea</span>
    <ul>
      <li data-node-id="n_a" data-side="right" data-folded="false" data-font-size="14" data-bold="false" data-text-color="#000000" data-fill-color="">
        <span class="node-title">Alpha</span>
        <ul>
          <li data-node-id="n_b" data-side="right" data-folded="false" data-font-size="14" data-bold="false" data-text-color="#000000" data-fill-color="">
            <span class="node-title">Beta</span>
          </li>
        </ul>
      </li>
      <li data-node-id="n_c" data-side="left" data-folded="false" data-font-size="14" data-bold="false" data-text-color="#000000" data-fill-color="">
        <span class="node-title">Gamma</span>
      </li>
    </ul>
  </li>
</ul>
</article>
</body>
</html>
