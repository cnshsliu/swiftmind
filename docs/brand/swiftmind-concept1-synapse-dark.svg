<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">SwiftMind — Synapse Tree (Dark)</title>
  <desc id="d">A luminous central node with three curved branches reaching each side, on a dark rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A30"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7D7AFF"/>
      <stop offset="1" stop-color="#64D2FF"/>
    </linearGradient>
    <linearGradient id="branchL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7D7AFF"/>
      <stop offset="1" stop-color="#64D2FF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="branchR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D7AFF"/>
      <stop offset="1" stop-color="#64D2FF" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7D7AFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7D7AFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="115" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="190" fill="url(#halo)"/>

  <g fill="none" stroke-width="10" stroke-linecap="round">
    <path d="M 226 256 C 172 256, 172 152, 142 152" stroke="url(#branchL)"/>
    <path d="M 226 256 C 182 256, 152 256, 122 256" stroke="url(#branchL)"/>
    <path d="M 226 256 C 172 256, 172 360, 142 360" stroke="url(#branchL)"/>
    <path d="M 286 256 C 340 256, 340 152, 370 152" stroke="url(#branchR)"/>
    <path d="M 286 256 C 330 256, 360 256, 390 256" stroke="url(#branchR)"/>
    <path d="M 286 256 C 340 256, 340 360, 370 360" stroke="url(#branchR)"/>
  </g>

  <g fill="url(#core)">
    <circle cx="142" cy="152" r="20"/>
    <circle cx="122" cy="256" r="20"/>
    <circle cx="142" cy="360" r="20"/>
    <circle cx="370" cy="152" r="20"/>
    <circle cx="390" cy="256" r="20"/>
    <circle cx="370" cy="360" r="20"/>
  </g>
  <circle cx="256" cy="256" r="36" fill="url(#core)" filter="url(#glow)"/>
</svg>
